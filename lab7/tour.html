<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#17171a;color:white;font:16px system-ui}.stage{height:100vh;display:grid;place-items:center;position:relative;overflow:hidden}.stage img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.stage:hover img{transform:scale(1.08)}.caption{position:absolute;bottom:12px;left:12px;background:#151517cc;padding:10px 14px;border-radius:12px}button{position:absolute;right:12px;top:12px;background:#fb5b57;color:white;border:0;border-radius:10px;padding:10px;cursor:pointer}</style><div class="stage"><img id="scene" src="img/photo1.jpg" alt="Интерьерийн танилцуулга"><span class="caption" id="caption">Интерьер 1 / 6</span><button id="next">Дараагийн өрөө →</button></div><script>let i=1;document.getElementById('next').onclick=()=>{i=i%6+1;document.getElementById('scene').src='img/photo'+i+'.jpg';document.getElementById('caption').textContent='Интерьер '+i+' / 6'}</script></html>
